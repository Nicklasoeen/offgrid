<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offgrid | Register</title>
    <meta
      name="description"
      content="Create an Offgrid account and join a social platform for explorers and adventurers."
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <script type="module" src="./src/js/main.js"></script>
  </head>
  <body data-page="register">
    <div class="auth-shell container-xl">
      <section class="auth-intro card h-100 border-0 shadow-sm">
        <div class="auth-brand">
          <img
            class="brand-logo brand-logo-large"
            src="./assets/offgrid-icon.png"
            alt="Offgrid logo"
          />
          <p class="eyebrow">Offgrid</p>
        </div>
        <h1>Create your account</h1>
        <p class="intro">
          Join a community built for hikes, expeditions, camp life, and people
          who actually enjoy being offline once in a while.
        </p>
        <a class="text-link" href="./index.html">Back to feed preview</a>
      </section>

      <main class="auth-card card h-100 border-0 shadow-sm">
        <div class="section-heading compact d-flex justify-content-between align-items-start">
          <div>
            <p class="eyebrow">Account</p>
            <h2>Register</h2>
          </div>
        </div>

        <form class="stacked-form needs-validation" aria-label="Register form" action="./profile.html" method="post" novalidate>
          <label class="form-label mb-0">
            <span>Name</span>
            <input
              class="form-control"
              type="text"
              name="name"
              placeholder="Choose a username"
              minlength="2"
              required
            />
            <div class="invalid-feedback">Please choose a username.</div>
          </label>

          <label class="form-label mb-0">
            <span>Email</span>
            <input
              class="form-control"
              type="email"
              name="email"
              placeholder="name@stud.noroff.no"
              required
            />
            <div class="invalid-feedback">Enter a valid email address.</div>
          </label>

          <label class="form-label mb-0">
            <span>Password</span>
            <input
              class="form-control"
              type="password"
              name="password"
              placeholder="Create a password"
              minlength="8"
              required
            />
            <div class="invalid-feedback">Password must be at least 8 characters.</div>
          </label>

          <button class="button btn btn-success" type="submit">Create account</button>
        </form>

        <p class="form-helper">
          Already registered?
          <a class="text-link" href="./login.html">Go to login</a>
        </p>
      </main>
    </div>
  </body>
</html>
